[workspace]
resolver = "3"
members = ["crates/luastd", "crates/luastd_lua", "crates/luastd_runtime"]
# luastd_lua forces mlua's `module` feature; keep it out of plain `cargo build`
# and `cargo test` so feature unification does not leak `module` into test
# binaries. lux builds it with `-p luastd_lua`. tinyvi is a standalone example
# leaf (its own workspace) so it does not join feature unification here.
default-members = ["crates/luastd", "crates/luastd_runtime"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/dxkbroom/luastd"
license = "MIT"

[workspace.dependencies]
camino = "1"
deno_permissions = "0.119.0"
formatx = "0.4.2"
luastd = { path = "crates/luastd", version = "0.0.1" }
luastd_runtime = { path = "crates/luastd_runtime", version = "0.0.1" }
# Never enable a Lua version, `vendored` or `module` here: only leaf crates pick
# them (see AGENTS.md).
mlua = "0.12"
self_cell = "1.3.0"
semver = "1"
serde_json = { version = "1", features = ["preserve_order"] }
# RealSys for deno_permissions' descriptor parser; winapi for home dirs on Windows.
sys_traits = { version = "0.1.28", features = ["libc", "real", "winapi"] }
tempfile = "3"
tokio = { version = "1", features = ["rt", "time"] }
tokio-util = "0.7"

[workspace.lints.rust]
unsafe_code = "forbid"
