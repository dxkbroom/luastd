#:schema https://raw.githubusercontent.com/jdx/mise/refs/heads/main/schema/mise-task.json

[bootstrap]
run = ["cargo install"]

[clean]
description = "Clean build artifacts"
run = "cargo clean"

[build]
alias = "b"
usage = """
arg "<TARGET>" default="luajit52" {
  choices "luajit52" "luajit" "lua52" "lua53" "lua54" "lua55"
}
"""
run = "{{ get_env(name='MISE_CARGO_BUILD_COMMAND', default='cargo build') }} --workspace --features=luastd_lua/$usage_target,luastd_runtime/env {{ get_env(name='MISE_CARGO_BUILD_EXTRA_ARGS', default='') }}"
run_windows = "{{ get_env(name='MISE_CARGO_BUILD_COMMAND', default='cargo build') }} --workspace --features=luastd_lua/$usage_target,luastd_runtime/env {{ get_env(name='MISE_CARGO_BUILD_EXTRA_ARGS', default='') }}"
description = "Build the project"

[fmt]
description = "Format TOML, Markdown, Rust and Lua files"
alias = ["format"]
run = ["cargo fmt --all --", "rumdl fmt", "tombi format", "uv run --project xtasks ruff format xtasks/", "luafmt --write --recursive spec/ crates/luastd/definitions crates/luastd_runtime/definitions crates/luastd_runtime/tests/lua crates/luastd_runtime/src/async.lua"]

[lint]
description = "Lint TOML, Markdown, Rust and Lua files"
alias = ["check"]
usage = """
arg "<TARGET>" default="luajit52" {
  choices "luajit52" "luajit" "lua52" "lua53" "lua54" "lua55"
}
"""
run = ["rumdl check", "tombi check", "uv run --project xtasks ruff check xtasks/", "cargo clippy --workspace --all-targets --features=luastd_lua/$usage_target,luastd_runtime/env -- -D warnings", "emmylua_check --config .emmyrc.json spec/ crates/luastd/definitions/ crates/luastd_runtime/definitions/ crates/luastd_runtime/tests/lua/ crates/luastd_runtime/src/async.lua --warnings-as-errors"]

[example]
description = "Run the luastd_runtime hello example (vendored LuaJIT 5.2-compat)"
run = "cargo run -p luastd_runtime --example hello --features luajit52,vendored"

["nvim:build"]
description = "Build the luastd cdylib for Neovim's LuaJIT into target/nvim (loaded by .lazy.lua)"
run = "cargo build --release -p luastd_lua --features luastd_lua/luajit --target-dir target/nvim"

["fork:build"]
description = "Rebuild the local emmylua-analyzer-rust fork (temporary until we switch to a remote source)"
dir = "{{config_root}}/../emmylua-analyzer-rust"
run = "cargo build --release -p emmylua_check -p emmylua_ls -p emmylua_formatter"

[test]
description = "run all tests"
alias = "t"
usage = """
arg "<TARGET>" default="luajit52" {
  choices "luajit52" "luajit" "lua52" "lua53" "lua54" "lua55"
}
"""
run = ["mise tasks run test:unit $usage_target"]

["test:unit"]
description = "run unit tests"
usage = """
arg "<TARGET>" default="luajit52" {
  choices "luajit52" "luajit" "lua52" "lua53" "lua54" "lua55"
}
"""
run = """
#!/usr/bin/env bash
set -xeuo pipefail
# Default members only: luastd_lua forces mlua's `module`, which cannot link
# test binaries. lux builds luastd_lua itself (lux.toml).
cargo test --features "luastd/$usage_target,luastd_runtime/env"
case "$usage_target" in
  # lux builds jit52 with mlua's `luajit` feature anyway, and has no luajit52
  # interpreter here (its busted wrapper falls back to /usr/bin/lua).
  luajit52 | luajit) lua_version=jit ;;
  lua5*) lua_version="5.${usage_target#lua5}" ;;
esac
lx test --lua-version="$lua_version" --no-luarc
"""
env = { CARGO_TERM_COLOR = "always", "RUST_TEST_THREADS" = "1" }
