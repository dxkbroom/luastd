[package]
name = "tinyvi"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
description = "A small ratatui modal editor exercising luastd (example)."
license = "MIT"

[workspace]

[[bin]]
name = "tinyvi"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
luastd = { path = "../../crates/luastd" }
luastd_runtime = { path = "../../crates/luastd_runtime", features = ["env", "fs", "luajit52", "process", "vendored"] }
ratatui = "0.30"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[lints.rust]
unsafe_code = "deny"
